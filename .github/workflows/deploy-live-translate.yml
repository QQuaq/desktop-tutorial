name: Deploy live-translate to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "live-translate/**"
      - ".github/workflows/deploy-live-translate.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-live-translate
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: live-translate/package-lock.json

      - name: Install and build
        working-directory: live-translate
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: live-translate/out
          commit_message: "ci: deploy live-translate site"