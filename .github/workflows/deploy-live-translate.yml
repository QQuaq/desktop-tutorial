name: Deploy live-translate to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "live-translate/**"
      - ".github/workflows/deploy-live-translate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-live-translate
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: live-translate/package-lock.json

      - name: Install and build
        working-directory: live-translate
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build

      - name: Copy static site to docs/
        run: |
          rm -rf docs
          cp -a live-translate/out/. docs/

      - name: Commit docs for GitHub Pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "chore: deploy live-translate to docs/"
          file_pattern: docs/**