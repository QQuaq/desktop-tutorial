name: Build live-translate-tv APK

on:
  push:
    branches: [main]
    paths:
      - "live-translate-tv/**"
      - ".github/workflows/live-translate-tv-apk.yml"
  pull_request:
    paths:
      - "live-translate-tv/**"
      - ".github/workflows/live-translate-tv-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-translate-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: live-translate-tv-debug-apk
          path: live-translate-tv/app/build/outputs/apk/debug/app-debug.apk
